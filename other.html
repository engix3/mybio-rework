<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg-color: #050505;
            --card-bg: rgba(20, 20, 20, 0.5);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --glow-color: rgba(255, 255, 255, 0.8);
            --accent: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: crosshair;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Particles Background */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            bottom: -10px;
            width: 2px;
            height: 2px;
            background: var(--text-main);
            border-radius: 50%;
            box-shadow: 0 0 10px 2px var(--glow-color);
            animation: float-up linear infinite;
            opacity: 0.5;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-100vh) scale(0.5);
                opacity: 0;
            }
        }

        /* Overlay "Click to Enter" */
        #enter-screen {
            position: absolute;
            inset: 0;
            background: var(--bg-color);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .enter-text {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
            user-select: none;
            cursor: pointer;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.4;
                text-shadow: none;
            }

            50% {
                opacity: 1;
                text-shadow: 0 0 15px var(--glow-color);
            }
        }

        /* Main Content */
        #main-content {
            opacity: 0;
            visibility: hidden;
            transform: scale(0.95);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        #main-content.visible {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        /* Profile Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            animation: hover-card 6s ease-in-out infinite alternate;
        }

        @keyframes hover-card {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-10px);
            }
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #111, #222);
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05) rotate(5deg);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .username-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .username {
            font-size: 1.8rem;
            font-weight: 800;
            text-shadow: 0 0 10px var(--glow-color);
            letter-spacing: 1px;
        }

        .badges {
            display: flex;
            gap: 5px;
            font-size: 1.1rem;
        }

        .bio-box {
            margin: 15px 0 30px;
            min-height: 24px;
        }

        .typewriter {
            font-family: monospace;
            font-size: 1rem;
            color: var(--text-muted);
            border-right: 2px solid var(--text-main);
            padding-right: 4px;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            50% {
                border-color: transparent;
            }
        }

        /* Social Links */
        .socials {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .social-link {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-link svg {
            width: 22px;
            height: 22px;
            transition: transform 0.3s ease;
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }

        .social-link:hover svg {
            transform: scale(1.1);
        }

        /* Footer / Stats */
        .stats {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-flex;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Scanline Overlay */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom,
                    rgba(255, 255, 255, 0),
                    rgba(255, 255, 255, 0) 50%,
                    rgba(0, 0, 0, 0.1) 50%,
                    rgba(0, 0, 0, 0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.3;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }

            .username {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="scanlines"></div>
    <div id="particles"></div>

    <div id="enter-screen" onclick="enterSite()">
        <div class="enter-text">[ click to enter ]</div>
    </div>

    <div id="main-content">

                    <span title="Verified">✅</span>
                    <span title="Developer">💻</span>
                    <span title="Premium">💎</span>
                </div>
            </div>

            <div class="bio-box">
                <span class="typewriter" id="typewriter"></span>
            </div>

            <div class="socials">

                <!-- GitHub -->
                <a href="#" class="social-link" title="GitHub">
                    <svg viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
                    </svg>
                </a>
            </div>

            <div class="stats">
                👁️ 1337 views
            </div>
        </div>
    </div>

    <script>
        // Particles generation
        const particlesContainer = document.getElementById('particles');
        const particleCount = 40;

        for (let i = 0; i < particleCount; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (Math.random() * 4 + 3) + 's';
            p.style.animationDelay = (Math.random() * 5) + 's';
            particlesContainer.appendChild(p);
        }

        // Enter screen logic
        let entered = false;
        function enterSite() {
            if (entered) return;
            entered = true;

            const enterScreen = document.getElementById('enter-screen');
            const mainContent = document.getElementById('main-content');

            enterScreen.style.opacity = '0';
            setTimeout(() => {
                enterScreen.style.display = 'none';
                mainContent.classList.add('visible');
                startTypewriter();
            }, 800);
        }

        // Typewriter effect
        const texts = [
            "Welcome to my bio...",
            "Fullstack Developer 💻",
            "Design Enthusiast 🎨",
            "No place like 127.0.0.1 🌐"
        ];

        let count = 0;
        let index = 0;
        let currentText = "";
        let letter = "";
        let isDeleting = false;
        const typeTarget = document.getElementById('typewriter');

        function startTypewriter() {
            if (count === texts.length) {
                count = 0;
            }
            currentText = texts[count];

            if (isDeleting) {
                letter = currentText.slice(0, --index);
            } else {
                letter = currentText.slice(0, ++index);
            }

            typeTarget.textContent = letter;

            let typeSpeed = isDeleting ? 40 : 100;

            if (!isDeleting && letter.length === currentText.length) {
                typeSpeed = 2000;
                isDeleting = true;
            } else if (isDeleting && letter.length === 0) {
                isDeleting = false;
                count++;
                typeSpeed = 500;
            }

            setTimeout(startTypewriter, typeSpeed);
        }
    </script>
</body>

</html>
